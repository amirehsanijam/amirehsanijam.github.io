name: Diagnose Iranian connectivity
on:
  push:
    paths: [.github/workflows/iran-connectivity.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public frontend and API from external and Iranian networks
        shell: python
        run: |
          import json, urllib.request, urllib.parse, time
          def get(url):
              request = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'Bonice-network-diagnostics'})
              with urllib.request.urlopen(request, timeout=40) as response:
                  return json.load(response)
          api='https://bonice-group-production.up.railway.app/api/orders'
          try:
              request=urllib.request.Request(api,headers={'Origin':'https://amirehsanijam.github.io'})
              with urllib.request.urlopen(request,timeout=40) as response:
                  data=json.load(response)
                  print(json.dumps({'external_api_status':response.status,'content_type':response.headers.get('content-type'),'cors':response.headers.get('access-control-allow-origin'),'valid_orders_response':isinstance(data.get('orders'),list)}))
          except Exception as error:
              print('External API check failed: '+str(error))
          def request_json(url, body=None):
              payload=None if body is None else json.dumps(body).encode()
              request=urllib.request.Request(url,data=payload,headers={'Content-Type':'application/json','User-Agent':'Bonice-network-diagnostics'})
              with urllib.request.urlopen(request,timeout=40) as response:
                  return json.load(response)
          for target in ['bonice-group-production.up.railway.app']:
              try:
                  created=request_json('https://api.globalping.io/v1/measurements',{'type':'http','target':target,'locations':[{'country':'IR'}],'limit':3,'measurementOptions':{'protocol':'HTTPS','request':{'method':'OPTIONS','path':'/api/orders','headers':{'Origin':'https://amirehsanijam.github.io','Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type'}}}})
                  print(json.dumps({'target':target,'measurement':created}))
                  result={}
                  for attempt in range(12):
                      time.sleep(5)
                      result=request_json('https://api.globalping.io/v1/measurements/'+created['id'])
                      if result.get('status')!='in-progress': break
                  print(json.dumps({'target':target,'iran_results':result}))
              except Exception as error:
                  print('Regional measurement failed for '+target+': '+str(error))
                  raise
